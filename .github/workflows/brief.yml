name: DAZA Brief

on:
  # 已搁置：每天两次的定时空跑已暂停，保留手动触发
  # 如需恢复，把下面这段 schedule 取消注释即可
  # schedule:
  #   - cron: '10 1,13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'watchlist.txt'
      - 'config/schedule.json'
      - 'koc/**'
      - 'run_brief.py'
      - 'build_page.py'
      - 'rubric.md'
      - 'preview-real-b.html'
      - 'tests/**'
      - '.github/workflows/brief.yml'

permissions:
  contents: write

concurrency:
  group: daza-brief
  cancel-in-progress: true

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore existing Pages output
        run: |
          mkdir -p output
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive FETCH_HEAD | tar -x -C output
          fi

      - name: Verify code and contracts
        run: |
          python -m compileall -q koc run_brief.py build_page.py
          python -m unittest discover -s tests -v

      - name: Generate DAZA Brief
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          ENABLE_ENRICH: '0'
        run: python run_brief.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          enable_jekyll: false
          keep_files: true
          force_orphan: false
          commit_message: 'brief: ${{ github.run_id }}'
